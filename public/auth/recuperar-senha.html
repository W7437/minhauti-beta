<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar senha — MinhaUTI</title><link rel="stylesheet" href="/app/shared/global.css"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#f7fafb}.box{width:min(430px,100%);background:#fff;border:1px solid #dce5e9;border-radius:16px;padding:24px;box-shadow:0 14px 45px #01193212}h1{color:#062746;margin-top:0}label{font-weight:800;font-size:13px}input{display:block;width:100%;padding:12px;margin:7px 0 14px;border:1px solid #cad7dd;border-radius:10px}button{width:100%;padding:12px;border:0;border-radius:10px;background:#21b8b3;color:#fff;font-weight:900}.msg{font-size:13px;margin-top:12px}.back{display:block;text-align:center;margin-top:15px;font-size:13px}</style></head><body><main class="box"><h1>Recuperar senha</h1><p>Digite o e-mail cadastrado. Você receberá um link para definir uma nova senha.</p><form id="form"><label>E-mail<input id="email" type="email" required autocomplete="email"></label><button>Enviar link</button></form><div id="msg" class="msg"></div><a class="back" href="/auth/login.html">Voltar para entrar</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/auth/auth-config.js"></script><script>const cfg=MINHAUTI_AUTH,sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);form.addEventListener('submit',async e=>{e.preventDefault();const redirectTo=location.origin+(cfg.resetPath||'/redefinir-senha.html');const {error}=await sb.auth.resetPasswordForEmail(email.value.trim(),{redirectTo});msg.textContent=error?'Não foi possível enviar o link.':'Se o e-mail estiver cadastrado, o link de recuperação será enviado.'})</script></body></html>
