<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova senha — MinhaUTI</title><link rel="stylesheet" href="/app/shared/global.css"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#f7fafb}.box{width:min(430px,100%);background:#fff;border:1px solid #dce5e9;border-radius:16px;padding:24px;box-shadow:0 14px 45px #01193212}h1{color:#062746;margin-top:0}label{font-weight:800;font-size:13px}input{display:block;width:100%;padding:12px;margin:7px 0 14px;border:1px solid #cad7dd;border-radius:10px}button{width:100%;padding:12px;border:0;border-radius:10px;background:#21b8b3;color:#fff;font-weight:900}.msg{font-size:13px;margin-top:12px}</style></head><body><main class="box"><h1>Definir nova senha</h1><form id="form"><label>Nova senha<input id="password" type="password" minlength="8" required autocomplete="new-password"></label><label>Confirmar senha<input id="confirm" type="password" minlength="8" required autocomplete="new-password"></label><button>Salvar nova senha</button></form><div id="msg" class="msg"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/auth/auth-config.js"></script><script>const cfg=MINHAUTI_AUTH,sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{detectSessionInUrl:true}});form.addEventListener('submit',async e=>{e.preventDefault();if(password.value!==confirm.value){msg.textContent='As senhas não coincidem.';return}const {error}=await sb.auth.updateUser({password:password.value});if(error){msg.textContent='Não foi possível alterar a senha.';return}msg.textContent='Senha alterada. Redirecionando…';setTimeout(()=>location.replace('/auth/login.html'),700)})</script></body></html>
