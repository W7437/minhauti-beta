<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Entrar — MinhaUTI</title><link rel="stylesheet" href="/auth/auth.css?v=10.4"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth/auth-config.js?v=10.4"></script></head>
<body class="auth-page"><div class="auth-layout">
<header class="auth-topbar"><div class="auth-topbar-inner"><div class="auth-brand"><div class="auth-brand-mark" aria-label="Logo MinhaUTI">
<svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="authlg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a69b0"/><stop offset="100%" stop-color="#24c1bb"/></linearGradient></defs><rect x="5" y="5" width="54" height="54" rx="13" ry="13" fill="none" stroke="url(#authlg)" stroke-width="3"/><path d="M8 34h10l4-8 5 19 6-28 6 22 4-9 4 4h9" fill="none" stroke="#24c1bb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div><div class="auth-brand-title">Minha<span>UTI</span></div></div><div class="auth-status"><span class="auth-status-dot"></span>Acesso seguro</div></div></header>
<main class="auth-main"><section class="auth-intro"><h1>MinhaUTI</h1><p>Acesse sua conta para entrar no ambiente da UTI vinculada às suas credenciais.</p></section>
<section class="auth-card"><h2>Entrar no MinhaUTI</h2><div class="auth-subtitle">Utilize seu usuário e senha.</div>
<form id="form">
<label>Usuário<input id="username" type="text" autocomplete="username" required minlength="3" maxlength="32"/></label>
<div class="auth-row"><label>Senha</label><a href="/auth/recuperar-senha.html">Esqueci minha senha</a></div>
<input id="password" type="password" autocomplete="current-password" required/>
<label class="auth-agreement"><input id="agree" type="checkbox" required/><span>Li e concordo com as <a href="/legal/politicas.html" target="_blank" rel="noopener">Políticas de uso</a>.</span></label>
<button class="auth-primary" id="submit" type="submit">Entrar</button>
</form>
<div class="auth-footlink">Não possui uma conta? <a href="/auth/criar-conta.html">Criar conta</a></div>
<div id="msg" class="auth-message"></div></section></main>
<footer class="auth-footer">MinhaUTI</footer></div>
<script>
const cfg=window.MINHAUTI_AUTH||{}, msg=document.getElementById('msg'), btn=document.getElementById('submit');
const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
function show(t,k){msg.textContent=t;msg.className='auth-message '+k}
function go(){const p=new URLSearchParams(location.search).get('return');location.replace(p&&p.startsWith('/')?p:(cfg.homePath||'/app/main/'))}
(async()=>{const {data}=await sb.auth.getSession();if(data?.session)go()})();
form.addEventListener('submit',async e=>{
  e.preventDefault();msg.className='auth-message';btn.disabled=true;
  try{
    const r=await fetch((cfg.authApiBase||'')+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(d.error||'Usuário ou senha inválidos.');
    const {error}=await sb.auth.setSession({access_token:d.access_token,refresh_token:d.refresh_token});
    if(error)throw error;go();
  }catch(err){show(err.message||'Usuário ou senha inválidos.','error');btn.disabled=false}
});
</script></body></html>
