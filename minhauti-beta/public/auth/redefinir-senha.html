<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Redefinir senha — MinhaUTI</title><link rel="stylesheet" href="/auth/auth.css?v=10.4"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth/auth-config.js?v=10.4"></script></head>
<body class="auth-page"><div class="auth-layout">
<header class="auth-topbar"><div class="auth-topbar-inner"><div class="auth-brand"><div class="auth-brand-mark" aria-label="Logo MinhaUTI">
<svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="authlg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0a69b0"/><stop offset="100%" stop-color="#24c1bb"/></linearGradient></defs><rect x="5" y="5" width="54" height="54" rx="13" ry="13" fill="none" stroke="url(#authlg)" stroke-width="3"/><path d="M8 34h10l4-8 5 19 6-28 6 22 4-9 4 4h9" fill="none" stroke="#24c1bb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div><div class="auth-brand-title">Minha<span>UTI</span></div></div><div class="auth-status"><span class="auth-status-dot"></span>Recuperação de acesso</div></div></header>
<main class="auth-main"><section class="auth-intro"><h1>Nova senha</h1><p>Defina uma nova senha para sua conta.</p></section>
<section class="auth-card"><h2>Redefinir senha</h2><div class="auth-subtitle">Digite e confirme a nova senha.</div>
<form id="form">
<label>Nova senha<input id="password" type="password" autocomplete="new-password" required minlength="8"/></label>
<label>Confirmar nova senha<input id="confirm" type="password" autocomplete="new-password" required minlength="8"/></label>
<button class="auth-primary" id="submit" type="submit">Salvar nova senha</button>
</form>
<div class="auth-footlink"><a href="/auth/login.html">Voltar para o login</a></div>
<div id="msg" class="auth-message"></div></section></main>
<footer class="auth-footer">MinhaUTI</footer></div>
<script>
const cfg=window.MINHAUTI_AUTH||{},msg=document.getElementById('msg'),btn=document.getElementById('submit');
const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
function show(t,k){msg.textContent=t;msg.className='auth-message '+k}
form.addEventListener('submit',async e=>{
 e.preventDefault();if(password.value!==confirm.value){show('As senhas não coincidem.','error');return}
 btn.disabled=true;const {error}=await sb.auth.updateUser({password:password.value});
 if(error){show('O link pode ter expirado. Solicite uma nova recuperação de senha.','error');btn.disabled=false;return}
 show('Senha atualizada. Você já pode entrar com a nova senha.','ok');setTimeout(()=>location.replace('/auth/login.html'),1100)
});
</script></body></html>
